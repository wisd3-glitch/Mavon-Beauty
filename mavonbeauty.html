<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MavonBeauty — Skincare For Everyone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blush-bg:#FBF0F2;
    --cream:#FFFBFA;
    --rose:#E4879C;
    --rose-deep:#C24E6B;
    --rose-hot:#E63E67;
    --ink:#3A2430;
    --ink-soft:#7A5A63;
    --line:#EED6DC;
    --gold-pink:#F3D9DE;
    --green:#2E9E5B;
    --red:#E14545;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%;}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px; /* space for mobile bottom nav */
    overflow-x:hidden;
    max-width:100%;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px;}

  /* ===== Top bar ===== */
  .topbar{background:var(--ink);color:#F6DCE2;font-size:11.5px;letter-spacing:.02em;}
  .topbar .wrap{display:flex;justify-content:center;align-items:center;height:32px;text-align:center;}
  .topbar .promo{color:#fff;font-weight:600;}

  /* ===== Header ===== */
  header.main{background:var(--blush-bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
  nav.wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px;}
  .logo{font-size:19px;font-weight:600;letter-spacing:.01em;cursor:pointer;white-space:nowrap;}
  .logo span{color:var(--rose-hot);}
  .navlinks{display:none;gap:28px;font-size:14px;font-weight:600;color:var(--ink-soft);}
  .navlinks a.active{color:var(--rose-hot);}
  .navicons{display:flex;gap:14px;align-items:center;}
  .icon-btn{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;}
  .icon-btn svg{width:20px;height:20px;stroke:var(--ink);}
  .badge{
    position:absolute;top:-2px;right:-2px;background:var(--rose-hot);color:#fff;
    font-size:10px;font-weight:800;width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }

  /* ===== Bottom mobile nav ===== */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;background:var(--cream);
    border-top:1px solid var(--line);display:flex;z-index:50;
    box-shadow:0 -6px 16px -8px rgba(196,78,107,.2);
  }
  .bottom-nav button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 0 6px;background:none;border:none;color:var(--ink-soft);font-size:10.5px;font-weight:700;
  }
  .bottom-nav button svg{width:20px;height:20px;stroke:var(--ink-soft);}
  .bottom-nav button.active{color:var(--rose-hot);}
  .bottom-nav button.active svg{stroke:var(--rose-hot);}
  .bottom-nav .nav-badge{
    position:relative;
  }
  .bottom-nav .nav-badge .badge{top:-3px;right:8px;}

  /* ===== Toast ===== */
  #toast-wrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:200;width:calc(100% - 32px);max-width:400px;}
  .toast{
    padding:13px 16px;border-radius:10px;color:#fff;font-weight:700;font-size:13.5px;
    display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
    box-shadow:0 10px 24px -8px rgba(0,0,0,.25);animation:slidein .25s ease;
  }
  .toast.ok{background:var(--green);}
  .toast.err{background:var(--red);}
  @keyframes slidein{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

  /* ===== Hero ===== */
  .hero{background:radial-gradient(ellipse at 70% 20%, #FDE7EC 0%, var(--blush-bg) 55%);padding:36px 0 30px;}
  .hero-copy{text-align:center;}
  .hero-copy h1{font-size:34px;line-height:1.1;color:var(--ink);}
  .hero-copy p{margin:14px auto 22px;max-width:320px;color:var(--ink-soft);font-size:13.5px;line-height:1.65;}
  .btn-primary{
    display:inline-block;background:var(--rose-hot);color:#fff;font-weight:700;
    padding:13px 30px;border-radius:40px;font-size:13.5px;border:none;cursor:pointer;
    box-shadow:0 12px 20px -8px rgba(230,62,103,.5);
  }
  .hero-below{display:flex;justify-content:center;gap:14px;margin-top:26px;padding:0 10px;}
  .hero-below .item{border-radius:14px;flex:1;max-width:110px;height:110px;}
  .prod-a{background:linear-gradient(150deg,#F3D9DE,#EFB6C4);}
  .prod-b{background:linear-gradient(150deg,#E4879C,#C24E6B);border-radius:50% 50% 12px 12px/35% 35% 12px 12px;}
  .prod-c{background:linear-gradient(150deg,#F6A8BC,#E63E67);border-radius:50%;}

  /* ===== Section titles ===== */
  .section{padding:40px 0;}
  .eyebrow{color:var(--rose-hot);font-weight:700;font-size:11px;letter-spacing:.13em;text-transform:uppercase;}
  .section-title{font-size:23px;margin-top:6px;}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:10px;}

  /* ===== Categories ===== */
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center;}
  .cat-circle{
    width:66px;height:66px;border-radius:50%;margin:0 auto 8px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,var(--gold-pink),#F7DDE3);
  }
  .cat-circle svg{width:24px;height:24px;stroke:var(--rose-deep);}
  .cat-name{font-weight:700;font-size:12px;}

  /* ===== Products ===== */
  .prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .card{
    background:var(--blush-bg);border-radius:16px;padding:12px;
    border:1px solid var(--line);position:relative;cursor:pointer;
  }
  .card .tag{
    position:absolute;top:10px;left:10px;background:#fff;color:var(--rose-hot);
    font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px;z-index:2;
  }
  .card .tag.sale{background:var(--rose-hot);color:#fff;left:52px;}
  .prod-img{
    height:120px;border-radius:10px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(155deg,#F7DDE3,#EFB6C4);
  }
  .prod-img svg{width:36px;height:48px;stroke:var(--rose-deep);fill:none;}
  .card h4{font-size:12.5px;font-weight:700;margin-bottom:5px;line-height:1.3;}
  .card .price-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .card .price{color:var(--rose-hot);font-weight:800;font-size:13px;}
  .card .price-old{color:var(--ink-soft);font-size:11px;text-decoration:line-through;}
  .card .stock-flag{font-size:10px;color:var(--red);font-weight:700;margin-top:4px;}
  .view-all{
    border:1.5px solid var(--rose-hot);color:var(--rose-hot);font-weight:700;
    padding:8px 16px;border-radius:40px;font-size:11.5px;white-space:nowrap;background:none;cursor:pointer;
  }

  /* pagination */
  .pagination{display:flex;justify-content:center;gap:6px;margin-top:26px;flex-wrap:wrap;}
  .pagination button{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--cream);
    font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  }
  .pagination button.current{background:var(--rose-hot);border-color:var(--rose-hot);color:#fff;}

  /* ===== How to use ===== */
  .howto{background:var(--blush-bg);}
  .howto-img{border-radius:18px;height:220px;background:linear-gradient(160deg,#F3D9DE,#E4879C 60%,#C24E6B);margin-bottom:24px;}
  .step{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
  .step:last-child{border-bottom:none;}
  .step .num{font-family:'Fraunces',serif;font-size:18px;color:var(--rose-hot);font-weight:600;}
  .step h4{font-size:14.5px;margin-bottom:3px;}
  .step p{color:var(--ink-soft);font-size:12.5px;}

  /* ===== Testimonials ===== */
  .testimonials{background:var(--blush-bg);}
  .test-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  .test-card{background:var(--cream);border-radius:14px;padding:18px;border:1px solid var(--line);}
  .test-top{display:flex;gap:12px;align-items:center;margin-bottom:10px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(150deg,#E4879C,#C24E6B);flex-shrink:0;}
  .stars{color:var(--rose-hot);font-size:12px;}
  .test-card p{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:8px;}
  .test-name{font-weight:700;font-size:12.5px;}

  /* ===== Footer ===== */
  footer{background:var(--ink);color:#EFD3DA;}
  .foot-top{padding:36px 12px 20px 12px;display:grid;grid-template-columns:1fr;gap:24px;}
  .foot-top h5{color:#fff;font-size:13.5px;margin-bottom:12px;font-weight:700;}
  .foot-top p{font-size:12.5px;line-height:1.7;color:#C79AA5;}
  .foot-top li{font-size:12.5px;margin-bottom:9px;color:#D9AFB9;}
  .foot-brand{font-family:'Fraunces',serif;font-size:44px;font-weight:600;text-align:center;padding:16px 0 20px;}
  .foot-brand span{color:#5C424A;}
  .foot-bottom{border-top:1px solid #4A3540;padding:16px 20px;display:flex;flex-direction:column;gap:6px;font-size:11px;color:#B98A96;text-align:center;}

  /* ===== Breadcrumb ===== */
  .breadcrumb{display:flex;gap:6px;font-size:11.5px;color:var(--ink-soft);padding:14px 0;flex-wrap:wrap;}
  .breadcrumb a{color:var(--ink-soft);font-weight:600;}
  .breadcrumb a:last-child{color:var(--rose-hot);}

  /* ===== Product Detail ===== */
  .pd-image{
    height:280px;border-radius:16px;margin-bottom:18px;
    background:linear-gradient(155deg,#F7DDE3,#EFB6C4);
    display:flex;align-items:center;justify-content:center;
  }
  .pd-image svg{width:80px;height:110px;stroke:var(--rose-deep);fill:none;}
  .pd-title{font-size:21px;margin-bottom:8px;}
  .pd-price-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .pd-price{font-size:22px;font-weight:800;color:var(--rose-hot);}
  .pd-price-old{font-size:15px;color:var(--ink-soft);text-decoration:line-through;}
  .pd-rating{color:var(--ink-soft);font-size:13px;margin-bottom:10px;}
  .pd-rating .stars{color:#E7C6CC;}
  .pd-availability{font-weight:700;font-size:13.5px;margin-bottom:20px;}
  .pd-availability.in{color:var(--green);}
  .pd-availability.out{color:var(--red);}
  .qty-row{display:flex;align-items:center;gap:0;margin-bottom:8px;}
  .qty-label{font-weight:700;font-size:13.5px;margin-bottom:10px;display:block;}
  .qty-box{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;}
  .qty-box button{width:42px;height:42px;background:var(--blush-bg);border:none;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;}
  .qty-box .qty-val{width:48px;height:42px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--cream);}
  .btn-cart{
    width:100%;background:var(--ink);color:#fff;font-weight:700;padding:16px;border-radius:40px;
    font-size:14.5px;border:none;cursor:pointer;margin:22px 0;
  }
  .btn-cart:disabled{background:#C9BEC2;cursor:not-allowed;}
  .pd-block{border-top:1px solid var(--line);padding:18px 0;}
  .pd-block-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14.5px;cursor:pointer;}
  .share-row{display:flex;gap:10px;margin-top:12px;}
  .share-row .s-btn{
    width:38px;height:38px;border-radius:8px;background:var(--blush-bg);display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;
  }
  .pd-tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--rose-hot);text-decoration:underline;}
  .pd-details-body{margin-top:12px;font-size:13px;color:var(--ink-soft);line-height:1.7;}

  /* ===== Cart Drawer ===== */
  #cart-overlay{
    position:fixed;inset:0;background:rgba(58,36,48,.4);z-index:90;
    display:none;
  }
  #cart-drawer{
    position:fixed;top:0;right:0;bottom:0;width:100%;max-width:420px;background:var(--cream);
    z-index:100;display:flex;flex-direction:column;transform:translateX(100%);
    transition:transform .28s ease;
  }
  #cart-drawer.open{transform:translateX(0);}
  #cart-overlay.show{display:block;}
  .cart-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);}
  .cart-head h3{font-size:17px;}
  .cart-head button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink);}
  .cart-body{flex:1;overflow-y:auto;padding:14px 20px;}
  .cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .cart-item .thumb{width:64px;height:64px;border-radius:10px;background:linear-gradient(155deg,#F7DDE3,#EFB6C4);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .cart-item .thumb svg{width:22px;height:30px;stroke:var(--rose-deep);fill:none;}
  .cart-item .ci-name{font-size:13px;font-weight:700;line-height:1.35;margin-bottom:8px;}
  .cart-item .ci-bottom{display:flex;justify-content:space-between;align-items:center;}
  .cart-item .ci-price{font-weight:800;color:var(--rose-hot);font-size:13.5px;}
  .mini-qty{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .mini-qty button{width:28px;height:28px;background:var(--blush-bg);border:none;font-weight:700;cursor:pointer;}
  .mini-qty .v{width:30px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;}
  .ci-trash{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:16px;margin-left:8px;}
  .cart-empty{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:13.5px;}
  .cart-foot{border-top:1px solid var(--line);padding:16px 20px 20px;}
  .subtotal-row{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:14px;}
  .cart-links{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;font-weight:700;}
  .cart-links a{text-decoration:underline;cursor:pointer;}

  @media(min-width:760px){
    body{padding-bottom:0;}
    .bottom-nav{display:none;}
    .navlinks{display:flex;}
    .hero-copy h1{font-size:52px;}
    .cats{grid-template-columns:repeat(6,1fr);}
    .prod-grid{grid-template-columns:repeat(4,1fr);}
    .foot-top{grid-template-columns:1.4fr 1fr 1fr 1fr;}
    .foot-bottom{flex-direction:row;justify-content:space-between;text-align:left;}
    .test-grid{grid-template-columns:repeat(4,1fr);}
  }
</style>
</head>
<body>

<div id="toast-wrap"></div>

<div class="topbar"><div class="wrap"><div class="promo">Save 15% on orders over ₦50,000 · Use code PINK15 at checkout</div></div></div>

<header class="main">
  <nav class="wrap">
    <div class="logo" onclick="goHome()">Mavon<span>Beauty</span></div>
    <div class="navlinks">
      <a href="#" onclick="goHome();return false;" class="active">Home</a>
      <a href="#" onclick="goShop();return false;">Shop</a>
      <a href="#" onclick="return false;">About us</a>
      <a href="#" onclick="return false;">Contact us</a>
    </div>
    <div class="navicons">
      <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
      <button class="icon-btn" onclick="openCart()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 2h12l1 5H5l1-5Z"/><path d="M5 7h14l-1.2 13H6.2L5 7Z"/></svg>
        <span class="badge" id="cart-badge-top" style="display:none;">0</span>
      </button>
    </div>
  </nav>
</header>

<main id="app"></main>

<nav class="bottom-nav">
  <button id="nav-home" onclick="goHome()"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button id="nav-shop" onclick="goShop()"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="4" y="7" width="16" height="14" rx="2"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>Shop</button>
  <button class="nav-badge" onclick="openCart()"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 2h12l1 5H5l1-5Z"/><path d="M5 7h14l-1.2 13H6.2L5 7Z"/></svg>Cart<span class="badge" id="cart-badge-bottom" style="display:none;">0</span></button>
  <button><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Account</button>
</nav>

<div id="cart-overlay" onclick="closeCart()"></div>
<div id="cart-drawer">
  <div class="cart-head">
    <h3 id="cart-title">Your cart (0 items)</h3>
    <button onclick="closeCart()">&times;</button>
  </div>
  <div class="cart-body" id="cart-body"></div>
  <div class="cart-foot" id="cart-foot"></div>
</div>

<script>
/* ===== Data ===== */
const products = [
  {id:1, name:"Rosewater Gentle Cleanser", price:22500, oldPrice:null, tag:"New", stock:12, icon:"bottle", desc:"A pH-balanced cleanser infused with rosewater and mild botanical surfactants. Meticulously removes dirt and makeup without stripping the skin barrier, leaving skin soft, calm, and eye-safe."},
  {id:2, name:"Blush Petal Toner", price:19000, oldPrice:26000, tag:"Sale", stock:8, icon:"bottle", desc:"An alcohol-free toner that refines pores and preps skin to better absorb serums. Formulated with rose petal extract and niacinamide for a soft, dewy finish."},
  {id:3, name:"Dewy Glow Serum", price:28500, oldPrice:null, tag:"New", stock:2, icon:"bottle", desc:"A lightweight hyaluronic-acid serum that floods skin with hydration and boosts natural radiance within two weeks of daily use."},
  {id:4, name:"Silk Bloom Lotion", price:17500, oldPrice:null, tag:null, stock:15, icon:"bottle", desc:"A silky everyday moisturiser with shea butter and rose oil that absorbs fast and leaves no greasy residue."},
  {id:5, name:"Mist & Rose Spray", price:15000, oldPrice:null, tag:"New", stock:0, icon:"spray", desc:"A refreshing facial mist that can be used over makeup to instantly revive and hydrate tired skin."},
  {id:6, name:"Velvet Whipped Balm", price:12500, oldPrice:null, tag:null, stock:20, icon:"jar", desc:"A rich, whipped balm for extra-dry patches, elbows, and lips. Melts into skin on contact."},
  {id:7, name:"Petite Rose Duo Set", price:32000, oldPrice:null, tag:null, stock:9, icon:"bottle", desc:"A travel-friendly cleanser and toner duo, perfect for first-time MavonBeauty customers or weekend trips."},
  {id:8, name:"Night Bloom Oil", price:24000, oldPrice:null, tag:"New", stock:6, icon:"dropper", desc:"A nourishing overnight facial oil blending rosehip and jojoba to repair and replenish skin while you sleep."}
];

const icons = {
  bottle:'<svg viewBox="0 0 24 24"><rect x="7" y="6" width="10" height="15" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/></svg>',
  spray:'<svg viewBox="0 0 24 24"><path d="M9 3h6v4l3 3v11H6V10l3-3V3Z"/></svg>',
  jar:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>',
  dropper:'<svg viewBox="0 0 24 24"><rect x="9" y="4" width="6" height="16" rx="3"/></svg>'
};

/* ===== State ===== */
let state = {
  view:'home',      // 'home' | 'shop' | 'product'
  productId:null,
  cart:{},          // {productId: qty}
  page:1,
  reviewsOpen:false,
  detailsOpen:true
};

function money(n){ return '₦' + Math.round(n).toLocaleString('en-NG'); }

/* ===== Toast ===== */
function toast(msg, type){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='err' ? 'err' : 'ok');
  el.innerHTML = '<span>'+msg+'</span><span style="cursor:pointer;" onclick="this.parentElement.remove()">&times;</span>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2600);
}

/* ===== Cart logic ===== */
function cartCount(){
  return Object.values(state.cart).reduce((a,b)=>a+b,0);
}
function cartTotal(){
  let t = 0;
  for(const id in state.cart){
    const p = products.find(p=>p.id==id);
    t += p.price * state.cart[id];
  }
  return t;
}
function addToCart(id, qty){
  const p = products.find(p=>p.id==id);
  if(p.stock <= 0){ toast('Product out of stock', 'err'); return; }
  const current = state.cart[id] || 0;
  if(current + qty > p.stock){
    toast('Product out of stock', 'err');
    return;
  }
  state.cart[id] = current + qty;
  toast('Added to cart!', 'ok');
  syncBadges();
}
function changeCartQty(id, delta){
  const p = products.find(p=>p.id==id);
  const cur = state.cart[id] || 0;
  const next = cur + delta;
  if(next <= 0){
    delete state.cart[id];
    toast('Product removed from cart!', 'ok');
  } else if(next > p.stock){
    toast('Product out of stock', 'err');
    return;
  } else {
    state.cart[id] = next;
  }
  renderCartDrawer();
  syncBadges();
}
function removeCartItem(id){
  delete state.cart[id];
  toast('Product removed from cart!', 'ok');
  renderCartDrawer();
  syncBadges();
}
function clearCart(){
  state.cart = {};
  renderCartDrawer();
  syncBadges();
}
function syncBadges(){
  const c = cartCount();
  ['cart-badge-top','cart-badge-bottom'].forEach(id=>{
    const el = document.getElementById(id);
    el.style.display = c>0 ? 'flex' : 'none';
    el.textContent = c;
  });
}

/* ===== Cart Drawer render ===== */
function openCart(){
  renderCartDrawer();
  document.getElementById('cart-drawer').classList.add('open');
  document.getElementById('cart-overlay').classList.add('show');
}
function closeCart(){
  document.getElementById('cart-drawer').classList.remove('open');
  document.getElementById('cart-overlay').classList.remove('show');
}
function renderCartDrawer(){
  const count = cartCount();
  document.getElementById('cart-title').textContent = 'Your cart ('+count+' items)';
  const body = document.getElementById('cart-body');
  const foot = document.getElementById('cart-foot');
  if(count === 0){
    body.innerHTML = '<div class="cart-empty">Your cart is empty.<br>Explore our bestsellers and add something you love.</div>';
    foot.innerHTML = `
      <div class="subtotal-row"><span>Subtotal:</span><span>₦0</span></div>
      <button class="btn-cart" disabled>Checkout</button>
      <div class="cart-links"><a onclick="closeCart()">Continue shopping</a></div>
    `;
    return;
  }
  let rows = '';
  for(const id in state.cart){
    const p = products.find(p=>p.id==id);
    const qty = state.cart[id];
    rows += `
      <div class="cart-item">
        <div class="thumb">${icons[p.icon]}</div>
        <div style="flex:1;">
          <div class="ci-name">${p.name}</div>
          <div class="ci-bottom">
            <div class="ci-price">${money(p.price*qty)}</div>
            <div style="display:flex;align-items:center;">
              <div class="mini-qty">
                <button onclick="changeCartQty(${p.id},-1)">–</button>
                <div class="v">${qty}</div>
                <button onclick="changeCartQty(${p.id},1)">+</button>
              </div>
              <button class="ci-trash" onclick="removeCartItem(${p.id})">🗑</button>
            </div>
          </div>
        </div>
      </div>`;
  }
  body.innerHTML = rows;
  foot.innerHTML = `
    <div class="subtotal-row"><span>Subtotal:</span><span>${money(cartTotal())}</span></div>
    <button class="btn-cart" onclick="alert('Demo checkout — hook this up to your real payment flow.')">Checkout</button>
    <div class="cart-links"><a onclick="closeCart()">Continue shopping</a><a onclick="clearCart()">✕ Clear cart</a></div>
  `;
}

function productCardHTML(p){
  const oldPriceHTML = p.oldPrice ? `<span class="price-old">${money(p.oldPrice)}</span>` : '';
  const tagHTML = p.tag ? `<span class="tag ${p.tag==='Sale'?'sale':''}">${p.tag}</span>` : '';
  const stockHTML = p.stock<=0 ? `<div class="stock-flag">Out of stock</div>` : '';
  return `
    <div class="card" onclick="goProduct(${p.id})">
      ${tagHTML}
      <div class="prod-img">${icons[p.icon]}</div>
      <h4>${p.name}</h4>
      <div class="price-row"><span class="price">${money(p.price)}</span>${oldPriceHTML}</div>
      ${stockHTML}
    </div>`;
}

function pdAddToCart(id){
