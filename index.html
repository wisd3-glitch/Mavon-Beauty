<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MavonBeauty — Skincare For Everyone</title>
<meta name="description" content="MavonBeauty — gentle, rose-based skincare made for every skin story. Shop cleansers, serums, toners and balms, with delivery across Nigeria." />
<meta name="theme-color" content="#E63E67" />
<!-- Open Graph: controls the preview card when this site is shared on WhatsApp, Instagram, Facebook, etc. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="MavonBeauty" />
<meta property="og:title" content="MavonBeauty — Skincare For Everyone" />
<meta property="og:description" content="Gentle, rose-based skincare made for every skin story. Shop now, pay by card, transfer, or on delivery." />
<meta property="og:image" content="https://mavonbeauty.example.com/og-image.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<!-- TODO(backend): swap og:image for a real hosted product/banner image once product photos exist -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23E63E67'/%3E%3Cpath d='M12 18s-5.5-3.4-5.5-7.4A3.4 3.4 0 0 1 12 8.4a3.4 3.4 0 0 1 5.5 2.2c0 4-5.5 7.4-5.5 7.4Z' fill='%23FFF7F8'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blush-bg:#FBF0F2;
    --cream:#FFFBFA;
    --rose:#E4879C;
    --rose-deep:#C24E6B;
    --rose-hot:#E63E67;
    --ink:#3A2430;
    --ink-soft:#7A5A63;
    --line:#EED6DC;
    --gold-pink:#F3D9DE;
    --green:#2E9E5B;
    --red:#E14545;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%;}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px; /* space for mobile bottom nav */
    overflow-x:hidden;
    max-width:100%;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px;}

  /* ===== Top bar ===== */
  .topbar{background:var(--ink);color:#F6DCE2;font-size:11.5px;letter-spacing:.02em;}
  .topbar .wrap{display:flex;justify-content:center;align-items:center;height:32px;text-align:center;}
  .topbar .promo{color:#fff;font-weight:600;}

  /* ===== Header ===== */
  header.main{background:var(--blush-bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
  nav.wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px;}
  .logo{font-size:19px;font-weight:600;letter-spacing:.01em;cursor:pointer;white-space:nowrap;}
  .logo span{color:var(--rose-hot);}
  .navlinks{display:none;gap:28px;font-size:14px;font-weight:600;color:var(--ink-soft);}
  .navlinks a.active{color:var(--rose-hot);}
  .navicons{display:flex;gap:14px;align-items:center;}
  .icon-btn{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;}
  .icon-btn svg{width:20px;height:20px;stroke:var(--ink);}
  .badge{
    position:absolute;top:-2px;right:-2px;background:var(--rose-hot);color:#fff;
    font-size:10px;font-weight:800;width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }

  /* ===== Bottom mobile nav ===== */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;background:var(--cream);
    border-top:1px solid var(--line);display:flex;z-index:50;
    box-shadow:0 -6px 16px -8px rgba(196,78,107,.2);
  }
  .bottom-nav button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 0 6px;background:none;border:none;color:var(--ink-soft);font-size:10.5px;font-weight:700;
  }
  .bottom-nav button svg{width:20px;height:20px;stroke:var(--ink-soft);}
  .bottom-nav button.active{color:var(--rose-hot);}
  .bottom-nav button.active svg{stroke:var(--rose-hot);}
  .bottom-nav .nav-badge{
    position:relative;
  }
  .bottom-nav .nav-badge .badge{top:-3px;right:8px;}

  /* ===== Toast ===== */
  #toast-wrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:200;width:calc(100% - 32px);max-width:400px;}
  .toast{
    padding:13px 16px;border-radius:10px;color:#fff;font-weight:700;font-size:13.5px;
    display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
    box-shadow:0 10px 24px -8px rgba(0,0,0,.25);animation:slidein .25s ease;
  }
  .toast.ok{background:var(--green);}
  .toast.err{background:var(--red);}
  @keyframes slidein{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

  /* ===== Hero ===== */
  .hero{background:radial-gradient(ellipse at 70% 20%, #FDE7EC 0%, var(--blush-bg) 55%);padding:36px 0 30px;}
  .hero-copy{text-align:center;}
  .hero-copy h1{font-size:34px;line-height:1.1;color:var(--ink);}
  .hero-copy p{margin:14px auto 22px;max-width:320px;color:var(--ink-soft);font-size:13.5px;line-height:1.65;}
  .btn-primary{
    display:inline-block;background:var(--rose-hot);color:#fff;font-weight:700;
    padding:13px 30px;border-radius:40px;font-size:13.5px;border:none;cursor:pointer;
    box-shadow:0 12px 20px -8px rgba(230,62,103,.5);
  }
  .hero-below{display:flex;justify-content:center;gap:14px;margin-top:26px;padding:0 10px;}
  .hero-below .item{border-radius:14px;flex:1;max-width:110px;height:110px;}
  .prod-a{background:linear-gradient(150deg,#F3D9DE,#EFB6C4);}
  .prod-b{background:linear-gradient(150deg,#E4879C,#C24E6B);border-radius:50% 50% 12px 12px/35% 35% 12px 12px;}
  .prod-c{background:linear-gradient(150deg,#F6A8BC,#E63E67);border-radius:50%;}

  /* ===== Section titles ===== */
  .section{padding:40px 0;}
  .eyebrow{color:var(--rose-hot);font-weight:700;font-size:11px;letter-spacing:.13em;text-transform:uppercase;}
  .section-title{font-size:23px;margin-top:6px;}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:10px;}

  /* ===== Categories ===== */
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center;}
  .cat-circle{
    width:66px;height:66px;border-radius:50%;margin:0 auto 8px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,var(--gold-pink),#F7DDE3);
  }
  .cat-circle svg{width:24px;height:24px;stroke:var(--rose-deep);}
  .cat-name{font-weight:700;font-size:12px;}

  /* ===== Products ===== */
  .prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .card{
    background:var(--blush-bg);border-radius:16px;padding:12px;
    border:1px solid var(--line);position:relative;cursor:pointer;
  }
  .card .tag{
    position:absolute;top:10px;left:10px;background:#fff;color:var(--rose-hot);
    font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px;z-index:2;
  }
  .card .tag.sale{background:var(--rose-hot);color:#fff;left:52px;}
  .prod-img{
    height:120px;border-radius:10px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(155deg,#F7DDE3,#EFB6C4);
  }
  .prod-img svg{width:36px;height:48px;stroke:var(--rose-deep);fill:none;}
  .card h4{font-size:12.5px;font-weight:700;margin-bottom:5px;line-height:1.3;}
  .card .price-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .card .price{color:var(--rose-hot);font-weight:800;font-size:13px;}
  .card .price-old{color:var(--ink-soft);font-size:11px;text-decoration:line-through;}
  .card .stock-flag{font-size:10px;color:var(--red);font-weight:700;margin-top:4px;}
  .view-all{
    border:1.5px solid var(--rose-hot);color:var(--rose-hot);font-weight:700;
    padding:8px 16px;border-radius:40px;font-size:11.5px;white-space:nowrap;background:none;cursor:pointer;
  }

  /* pagination */
  .pagination{display:flex;justify-content:center;gap:6px;margin-top:26px;flex-wrap:wrap;}
  .pagination button{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--cream);
    font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  }
  .pagination button.current{background:var(--rose-hot);border-color:var(--rose-hot);color:#fff;}

  /* ===== How to use ===== */
  .howto{background:var(--blush-bg);}
  .howto-img{border-radius:18px;height:220px;background:linear-gradient(160deg,#F3D9DE,#E4879C 60%,#C24E6B);margin-bottom:24px;}
  .step{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
  .step:last-child{border-bottom:none;}
  .step .num{font-family:'Fraunces',serif;font-size:18px;color:var(--rose-hot);font-weight:600;}
  .step h4{font-size:14.5px;margin-bottom:3px;}
  .step p{color:var(--ink-soft);font-size:12.5px;}

  /* ===== Testimonials ===== */
  .testimonials{background:var(--blush-bg);}
  .test-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  .test-card{background:var(--cream);border-radius:14px;padding:18px;border:1px solid var(--line);}
  .test-top{display:flex;gap:12px;align-items:center;margin-bottom:10px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(150deg,#E4879C,#C24E6B);flex-shrink:0;}
  .stars{color:var(--rose-hot);font-size:12px;}
  .test-card p{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:8px;}
  .test-name{font-weight:700;font-size:12.5px;}

  /* ===== Footer ===== */
  footer{background:var(--ink);color:#EFD3DA;}
  .foot-top{padding:36px 12px 20px 12px;display:grid;grid-template-columns:1fr;gap:24px;}
  .foot-top h5{color:#fff;font-size:13.5px;margin-bottom:12px;font-weight:700;}
  .foot-top p{font-size:12.5px;line-height:1.7;color:#C79AA5;}
  .foot-top li{font-size:12.5px;margin-bottom:9px;color:#D9AFB9;}
  .foot-brand{font-family:'Fraunces',serif;font-size:44px;font-weight:600;text-align:center;padding:16px 0 20px;}
  .foot-brand span{color:#5C424A;}
  .foot-bottom{border-top:1px solid #4A3540;padding:16px 20px;display:flex;flex-direction:column;gap:6px;font-size:11px;color:#B98A96;text-align:center;}

  /* ===== Breadcrumb ===== */
  .breadcrumb{display:flex;gap:6px;font-size:11.5px;color:var(--ink-soft);padding:14px 0;flex-wrap:wrap;}
  .breadcrumb a{color:var(--ink-soft);font-weight:600;}
  .breadcrumb a:last-child{color:var(--rose-hot);}

  /* ===== Product Detail ===== */
  .pd-image{
    height:280px;border-radius:16px;margin-bottom:18px;
    background:linear-gradient(155deg,#F7DDE3,#EFB6C4);
    display:flex;align-items:center;justify-content:center;
  }
  .pd-image svg{width:80px;height:110px;stroke:var(--rose-deep);fill:none;}
  .pd-title{font-size:21px;margin-bottom:8px;}
  .pd-price-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .pd-price{font-size:22px;font-weight:800;color:var(--rose-hot);}
  .pd-price-old{font-size:15px;color:var(--ink-soft);text-decoration:line-through;}
  .pd-rating{color:var(--ink-soft);font-size:13px;margin-bottom:10px;}
  .pd-rating .stars{color:#E7C6CC;}
  .pd-availability{font-weight:700;font-size:13.5px;margin-bottom:20px;}
  .pd-availability.in{color:var(--green);}
  .pd-availability.out{color:var(--red);}
  .qty-row{display:flex;align-items:center;gap:0;margin-bottom:8px;}
  .qty-label{font-weight:700;font-size:13.5px;margin-bottom:10px;display:block;}
  .qty-box{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;}
  .qty-box button{width:42px;height:42px;background:var(--blush-bg);border:none;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;}
  .qty-box .qty-val{width:48px;height:42px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--cream);}
  .btn-cart{
    width:100%;background:var(--ink);color:#fff;font-weight:700;padding:16px;border-radius:40px;
    font-size:14.5px;border:none;cursor:pointer;margin:22px 0;
  }
  .btn-cart:disabled{background:#C9BEC2;cursor:not-allowed;}
  .pd-block{border-top:1px solid var(--line);padding:18px 0;}
  .pd-block-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14.5px;cursor:pointer;}
  .share-row{display:flex;gap:10px;margin-top:12px;}
  .share-row .s-btn{
    width:38px;height:38px;border-radius:8px;background:var(--blush-bg);display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;
  }
  .pd-tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--rose-hot);text-decoration:underline;}
  .pd-details-body{margin-top:12px;font-size:13px;color:var(--ink-soft);line-height:1.7;}

  /* ===== Cart Drawer ===== */
  #cart-overlay{
    position:fixed;inset:0;background:rgba(58,36,48,.4);z-index:90;
    display:none;
  }
  #cart-drawer{
    position:fixed;top:0;right:0;bottom:0;width:100%;max-width:420px;background:var(--cream);
    z-index:100;display:flex;flex-direction:column;transform:translateX(100%);
    transition:transform .28s ease;
  }
  #cart-drawer.open{transform:translateX(0);}
  #cart-overlay.show{display:block;}
  .cart-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);}
  .cart-head h3{font-size:17px;}
  .cart-head button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink);}
  .cart-body{flex:1;overflow-y:auto;padding:14px 20px;}
  .cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .cart-item .thumb{width:64px;height:64px;border-radius:10px;background:linear-gradient(155deg,#F7DDE3,#EFB6C4);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .cart-item .thumb svg{width:22px;height:30px;stroke:var(--rose-deep);fill:none;}
  .cart-item .ci-name{font-size:13px;font-weight:700;line-height:1.35;margin-bottom:8px;}
  .cart-item .ci-bottom{display:flex;justify-content:space-between;align-items:center;}
  .cart-item .ci-price{font-weight:800;color:var(--rose-hot);font-size:13.5px;}
  .mini-qty{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .mini-qty button{width:28px;height:28px;background:var(--blush-bg);border:none;font-weight:700;cursor:pointer;}
  .mini-qty .v{width:30px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;}
  .ci-trash{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:16px;margin-left:8px;}
  .cart-empty{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:13.5px;}
  .cart-foot{border-top:1px solid var(--line);padding:16px 20px 20px;}
  .subtotal-row{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:14px;}
  .cart-links{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;font-weight:700;}
  .cart-links a{text-decoration:underline;cursor:pointer;}

  @media(min-width:760px){
    body{padding-bottom:0;}
    .bottom-nav{display:none;}
    .navlinks{display:flex;}
    .hero-copy h1{font-size:52px;}
    .cats{grid-template-columns:repeat(6,1fr);}
    .prod-grid{grid-template-columns:repeat(4,1fr);}
    .foot-top{grid-template-columns:1.4fr 1fr 1fr 1fr;}
    .foot-bottom{flex-direction:row;justify-content:space-between;text-align:left;}
    .test-grid{grid-template-columns:repeat(4,1fr);}
  }

  /* ===== Accessibility: visible focus ===== */
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
    outline:2px solid var(--rose-hot);outline-offset:2px;border-radius:4px;
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }

  /* ===== Search overlay ===== */
  #search-overlay{position:fixed;inset:0;background:rgba(58,36,48,.4);z-index:110;display:none;}
  #search-overlay.show{display:block;}
  #search-panel{
    position:fixed;top:0;left:0;right:0;background:var(--cream);z-index:120;
    padding:16px 20px;box-shadow:0 12px 24px -10px rgba(58,36,48,.3);
    transform:translateY(-100%);transition:transform .22s ease;
  }
  #search-panel.open{transform:translateY(0);}
  .search-row{display:flex;gap:10px;align-items:center;}
  .search-row input{
    flex:1;border:1.5px solid var(--line);background:var(--blush-bg);border-radius:30px;
    padding:12px 16px;font-size:14px;font-family:inherit;color:var(--ink);
  }
  .search-row input:focus{outline:none;border-color:var(--rose-hot);}
  .search-close{background:none;border:none;font-size:22px;color:var(--ink);cursor:pointer;padding:4px 8px;}
  .search-results-count{font-size:12px;color:var(--ink-soft);margin-top:10px;}

  /* ===== Mobile hamburger menu ===== */
  .hamburger-btn{display:flex;}
  #mobile-menu-overlay{position:fixed;inset:0;background:rgba(58,36,48,.4);z-index:110;display:none;}
  #mobile-menu-overlay.show{display:block;}
  #mobile-menu-panel{
    position:fixed;top:0;left:0;right:0;background:var(--cream);z-index:120;
    padding:18px 20px 10px;box-shadow:0 12px 24px -10px rgba(58,36,48,.3);
    transform:translateY(-100%);transition:transform .22s ease;
    display:flex;flex-direction:column;
  }
  #mobile-menu-panel.open{transform:translateY(0);}
  .mmenu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .mmenu-head .logo{font-size:17px;}
  .mmenu-links a{
    display:block;padding:14px 2px;font-weight:700;font-size:15px;color:var(--ink);
    border-bottom:1px solid var(--line);cursor:pointer;
  }
  .mmenu-links a:last-child{border-bottom:none;}
  .mmenu-links a.active{color:var(--rose-hot);}
  @media(min-width:760px){
    .hamburger-btn{display:none;}
    #mobile-menu-panel{display:none;}
  }

  /* ===== Generic content / legal pages ===== */
  .content-page h1{font-size:26px;margin-bottom:6px;}
  .content-page .updated{font-size:12px;color:var(--ink-soft);margin-bottom:22px;}
  .content-page h3{font-size:15.5px;margin:22px 0 8px;}
  .content-page p, .content-page li{font-size:13.5px;color:var(--ink-soft);line-height:1.75;margin-bottom:10px;}
  .content-page li{margin-left:18px;}
  .content-page strong{color:var(--ink);}
  .info-card{background:var(--blush-bg);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0;}
  .info-card h4{font-size:13.5px;margin-bottom:6px;}
  .info-card p{margin-bottom:0;}

  /* ===== Contact ===== */
  .contact-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px;}
  .contact-card{
    display:flex;gap:14px;align-items:flex-start;background:var(--blush-bg);border:1px solid var(--line);
    border-radius:14px;padding:16px;
  }
  .contact-card .c-icon{
    width:38px;height:38px;border-radius:50%;background:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .contact-card .c-icon svg{width:18px;height:18px;stroke:var(--rose-hot);}
  .contact-card h4{font-size:13.5px;margin-bottom:3px;}
  .contact-card p{font-size:12.5px;color:var(--ink-soft);margin:0;}
  .contact-form{margin-top:26px;}

  /* ===== Forms (shared: checkout / account / contact / admin) ===== */
  .form-field{margin-bottom:16px;}
  .form-field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--ink);}
  .form-field .hint{font-size:11px;color:var(--ink-soft);font-weight:500;margin-top:5px;}
  .form-field input,.form-field textarea,.form-field select{
    width:100%;border:1.5px solid var(--line);background:var(--blush-bg);border-radius:10px;

<script>
/* =====================================================================
   CONFIG — everything a new business needs to change to make this
   storefront theirs. No other file/business logic below should need
   editing to re-skin this for a different client.
   TODO(backend): once the admin API exists, this object should be
   fetched from /api/store/config instead of hardcoded here, and the
   Admin → Settings tab should PATCH it back to the server.
   ===================================================================== */
const CONFIG = {

  businessNameAccent: "Beauty",
  tagline: "Skincare For Everyone",
  promoText: "Save 15% on orders over ₦50,000 · Use code PINK15 at checkout",

  phoneDisplay: "+234 801 234 5678",

  instagram: "https://instagram.com/mavonbeauty",
  facebook: "https://facebook.com/mavonbeauty",
  twitter: "https://x.com/mavonbeauty",
  nafdacNumber: "NAFDAC Reg. No. A7-1234",   // shown as a trust badge — replace with the real registration number
  /* Secret admin path — this, not a visible link, is how the business owner reaches /admin.
     Change this to your own random string before sharing the link with anyone.
     TODO(backend): this is obscurity, not security — once a real backend exists, replace
     this whole scheme with a proper login (session/JWT) and delete this token entirely. */
  adminAccessToken: "mvb2026-k9x4qz",
  deliveryAreas: [
    {state:"Lagos", fee:2000, etaDays:"1–2"},
    {state:"Ogun / Oyo", fee:3000, etaDays:"2–3"},
    {state:"Abuja (FCT)", fee:3500, etaDays:"2–4"},
    {state:"Other states", fee:4500, etaDays:"3–6"}
  ],
  pickupAddress: "12 Rosewater Close, Lekki Phase 1, Lagos — Mon–Sat, 9am–6pm",
  bankDetails: { bank:"GTBank", accountName:"Mavon Beauty Ltd", accountNumber:"0123456789" },
  colors: {
    accent:"#E63E67",     // --rose-hot
    accentDeep:"#C24E6B"  // --rose-deep
  }
};

/* Apply CONFIG-driven branding at runtime — this is what makes the file white-label */
function applyConfig(){
  document.title = `${CONFIG.businessName}${CONFIG.businessNameAccent} — ${CONFIG.tagline}`;
  document.documentElement.style.setProperty('--rose-hot', CONFIG.colors.accent);
  document.documentElement.style.setProperty('--rose-deep', CONFIG.colors.accentDeep);
  const promo = document.getElementById('promo-text');
  if(promo) promo.textContent = CONFIG.promoText;
}

/* ===== Data ===== */
const products = [
  {id:1, name:"Rosewater Gentle Cleanser", price:22500, oldPrice:null, tag:"New", stock:12, icon:"bottle", desc:"A pH-balanced cleanser infused with rosewater and mild botanical surfactants. Meticulously removes dirt and makeup without stripping the skin barrier, leaving skin soft, calm, and eye-safe."},
  {id:2, name:"Blush Petal Toner", price:19000, oldPrice:26000, tag:"Sale", stock:8, icon:"bottle", desc:"An alcohol-free toner that refines pores and preps skin to better absorb serums. Formulated with rose petal extract and niacinamide for a soft, dewy finish."},
  {id:3, name:"Dewy Glow Serum", price:28500, oldPrice:null, tag:"New", stock:2, icon:"bottle", desc:"A lightweight hyaluronic-acid serum that floods skin with hydration and boosts natural radiance within two weeks of daily use."},
  {id:4, name:"Silk Bloom Lotion", price:17500, oldPrice:null, tag:null, stock:15, icon:"bottle", desc:"A silky everyday moisturiser with shea butter and rose oil that absorbs fast and leaves no greasy residue."},
  {id:5, name:"Mist & Rose Spray", price:15000, oldPrice:null, tag:"New", stock:0, icon:"spray", desc:"A refreshing facial mist that can be used over makeup to instantly revive and hydrate tired skin."},
  {id:6, name:"Velvet Whipped Balm", price:12500, oldPrice:null, tag:null, stock:20, icon:"jar", desc:"A rich, whipped balm for extra-dry patches, elbows, and lips. Melts into skin on contact."},
  {id:7, name:"Petite Rose Duo Set", price:32000, oldPrice:null, tag:null, stock:9, icon:"bottle", desc:"A travel-friendly cleanser and toner duo, perfect for first-time MavonBeauty customers or weekend trips."},
  {id:8, name:"Night Bloom Oil", price:24000, oldPrice:null, tag:"New", stock:6, icon:"dropper", desc:"A nourishing overnight facial oil blending rosehip and jojoba to repair and replenish skin while you sleep."}
];

const icons = {
  bottle:'<svg viewBox="0 0 24 24"><rect x="7" y="6" width="10" height="15" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/></svg>',
  spray:'<svg viewBox="0 0 24 24"><path d="M9 3h6v4l3 3v11H6V10l3-3V3Z"/></svg>',
  jar:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>',
  dropper:'<svg viewBox="0 0 24 24"><rect x="9" y="4" width="6" height="16" rx="3"/></svg>'
};

/* ===== State =====
   Everything here lives in memory only for this MVP. Cart/orders/admin
   edits will not survive a refresh until they're backed by a real API —
   see the TODO(backend) markers throughout this file for the hook points. */
let state = {
  view:'home',        // 'home' | 'shop' | 'product' | 'checkout' | 'order-confirm' | 'account' | 'admin' | 'about' | 'contact' | 'delivery' | 'privacy' | 'terms' | 'returns'
  productId:null,
  cart:loadSharedCart(), // synced with account.html
  page:1,
  reviewsOpen:false,
  detailsOpen:true,
  searchQuery:'',
  searchOpen:false,
  mobileMenuOpen:false,
  orders:loadSharedOrders(), // synced with account.html
  lastOrder:null,
  checkoutErrors:{},
  adminAuthed:false,  // demo-only gate, NOT real auth — TODO(backend): replace with real admin login
  adminTab:'products', // 'products' | 'orders' | 'settings'
  adminModal:null,     // null | {mode:'add'|'edit', product:{...}}
  authTab:'login',     // 'login' | 'signup' on the Account page
  subscribers:[]       // newsletter emails captured this session — TODO(backend): POST /api/newsletter
};

function money(n){ return '₦' + Math.round(n).toLocaleString('en-NG'); }

/* ===== Toast ===== */
function toast(msg, type){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='err' ? 'err' : 'ok');
  el.innerHTML = '<span>'+msg+'</span><span style="cursor:pointer;" onclick="this.parentElement.remove()">&times;</span>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2600);
}

/* ===== Cart logic ===== */
const SHARED_CART_KEY = 'mavonbeauty_cart_v1';
const SHARED_ORDERS_KEY = 'mavonbeauty_orders_v1';
const SHARED_ACCOUNT_KEY = 'mavonbeauty_account_v1';

function loadSharedCart(){
  try { return JSON.parse(localStorage.getItem(SHARED_CART_KEY) || '{}'); } catch(_) { return {}; }
}
function saveSharedCart(){
  try { localStorage.setItem(SHARED_CART_KEY, JSON.stringify(state.cart)); } catch(_) {}
}
function loadSharedOrders(){
  try { return JSON.parse(localStorage.getItem(SHARED_ORDERS_KEY) || '[]'); } catch(_) { return []; }
}
function saveSharedOrders(){
  try { localStorage.setItem(SHARED_ORDERS_KEY, JSON.stringify(state.orders)); } catch(_) {}
}
function getSavedAccountProfile(){
  try {
    const raw = JSON.parse(localStorage.getItem(SHARED_ACCOUNT_KEY) || 'null');
    return (raw && raw.unlocked && raw.profile) ? raw.profile : null;
  } catch(_) { return null; }
}

function cartCount(){
  return Object.values(state.cart).reduce((a,b)=>a+b,0);
}
function cartTotal(){
  let t = 0;
  for(const id in state.cart){
    const p = products.find(p=>p.id==id);
    t += p.price * state.cart[id];
  }
  return t;
}
function addToCart(id, qty){
  const p = products.find(p=>p.id==id);
  if(p.stock <= 0){ toast('Product out of stock', 'err'); return; }
  const current = state.cart[id] || 0;
  if(current + qty > p.stock){
    toast('Product out of stock', 'err');
    return;
  }
  state.cart[id] = current + qty;
  saveSharedCart();
  toast('Added to cart!', 'ok');
  syncBadges();
}
function changeCartQty(id, delta){
  const p = products.find(p=>p.id==id);
  const cur = state.cart[id] || 0;
  const next = cur + delta;
  if(next <= 0){
    delete state.cart[id];
    toast('Product removed from cart!', 'ok');
  } else if(next > p.stock){
    toast('Product out of stock', 'err');
    return;
  } else {
    state.cart[id] = next;
  }
  saveSharedCart();
  renderCartDrawer();
  syncBadges();
}
function removeCartItem(id){
  delete state.cart[id];
  saveSharedCart();
  toast('Product removed from cart!', 'ok');
  renderCartDrawer();
  syncBadges();
}
function clearCart(){
  state.cart = {};
  saveSharedCart();
  renderCartDrawer();
  syncBadges();
}
function syncBadges(){
  const c = cartCount();
  ['cart-badge-top','cart-badge-bottom'].forEach(id=>{
    const el = document.getElementById(id);
    el.style.display = c>0 ? 'flex' : 'none';
    el.textContent = c;
  });
}

/* ===== Cart Drawer render ===== */
function openCart(){
  renderCartDrawer();
  document.getElementById('cart-drawer').classList.add('open');
  document.getElementById('cart-overlay').classList.add('show');
}
function closeCart(){
  document.getElementById('cart-drawer').classList.remove('open');
  document.getElementById('cart-overlay').classList.remove('show');
}
function renderCartDrawer(){
  const count = cartCount();
  document.getElementById('cart-title').textContent = 'Your cart ('+count+' items)';
  const body = document.getElementById('cart-body');
  const foot = document.getElementById('cart-foot');
  if(count === 0){
    body.innerHTML = '<div class="cart-empty">Your cart is empty.<br>Explore our bestsellers and add something you love.</div>';
    foot.innerHTML = `

/* =====================================================================
   Navigation / router — every view maps to a real #/... URL so pages
   can be bookmarked, shared (e.g. a product link sent on WhatsApp), and
   navigated with the browser back button, even before there's a server.
   ===================================================================== */
const SIMPLE_ROUTES = ['about','contact','delivery','privacy','terms','returns','account'];

function goHome(){ location.hash = '#/'; }
function goShop(){ location.hash = '#/shop'; }
function goProduct(id){ location.hash = '#/product/' + id; }
function goRoute(name){ location.hash = '#/' + name; }
function goCheckout(){
  if(cartCount()===0){ toast('Your cart is empty', 'err'); return; }
  location.hash = '#/checkout';
}

function parseHash(){
  const raw = (location.hash || '#/').slice(1);           // strip leading '#'
  const parts = raw.split('/').filter(Boolean);           // '/product/3' -> ['product','3']
  if(parts.length===0) return {view:'home'};
  if(parts[0]==='shop') return {view:'shop'};
  if(parts[0]==='product' && parts[1]) return {view:'product', productId:Number(parts[1])};
  if(parts[0]==='checkout') return {view:'checkout'};
  if(parts[0]==='order-confirm') return {view:'order-confirm'};
  // Admin only resolves with the exact secret token in the URL — e.g. #/admin/mvb2026-k9x4qz
  // Anything else under /admin (wrong token, or just #/admin) falls through to 'home' below,
  // same as any other unrecognized URL, so the route's existence isn't hinted at.
  if(parts[0]==='admin' && parts[1]===CONFIG.adminAccessToken) return {view:'admin'};
  if(SIMPLE_ROUTES.includes(parts[0])) return {view:parts[0]};
  return {view:'home'};
}

function route(){
  const r = parseHash();
  if(r.view==='product'){
    state.view='product'; state.productId=r.productId; state.reviewsOpen=false; state.detailsOpen=true;
  } else if(r.view==='shop'){
    state.view='shop'; state.page=1;
  } else {
    state.view=r.view;
  }
  closeSearch();
  closeMobileMenu();
  render();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

function productCardHTML(p){
  const oldPriceHTML = p.oldPrice ? `<span class="price-old">${money(p.oldPrice)}</span>` : '';
  const tagHTML = p.tag ? `<span class="tag ${p.tag==='Sale'?'sale':''}">${p.tag}</span>` : '';
  const stockHTML = p.stock<=0 ? `<div class="stock-flag">Out of stock</div>` : '';
  return `
    <div class="card" onclick="goProduct(${p.id})">
      ${tagHTML}
      <div class="prod-img">${icons[p.icon]}</div>
      <h4>${p.name}</h4>
      <div class="price-row"><span class="price">${money(p.price)}</span>${oldPriceHTML}</div>
      ${stockHTML}
    </div>`;
}

/* =====================================================================
   Mobile hamburger menu — collapses Home/Shop/About/Contact behind the
   three-line icon on phone-width screens. The panel itself is force-hidden
   above 760px by CSS regardless of this JS state, so resizing to desktop
   never leaves it stuck open.
   ===================================================================== */
function toggleMobileMenu(){
  state.mobileMenuOpen ? closeMobileMenu() : openMobileMenu();
}
function openMobileMenu(){
  state.mobileMenuOpen = true;
  document.getElementById('mobile-menu-overlay').classList.add('show');
  document.getElementById('mobile-menu-panel').classList.add('open');
  const btn = document.getElementById('hamburger-btn');
  btn.setAttribute('aria-expanded', 'true');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  syncMobileMenuActiveLink();
}
function closeMobileMenu(){
  state.mobileMenuOpen = false;
  const overlay = document.getElementById('mobile-menu-overlay');
  const panel = document.getElementById('mobile-menu-panel');
  const btn = document.getElementById('hamburger-btn');
  if(overlay) overlay.classList.remove('show');
  if(panel) panel.classList.remove('open');
  if(btn){
    btn.setAttribute('aria-expanded', 'false');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
  }
}
function syncMobileMenuActiveLink(){
  const map = {home:'mmenu-home', shop:'mmenu-shop', product:'mmenu-shop', about:'mmenu-about', contact:'mmenu-contact'};
  ['mmenu-home','mmenu-shop','mmenu-about','mmenu-contact'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.classList.remove('active');
  });
  const activeId = map[state.view];
  if(activeId){
    const el = document.getElementById(activeId);
    if(el) el.classList.add('active');
  }
}

/* =====================================================================
   Search — filters the in-memory product list. Works fully client-side
   for now; TODO(backend): swap the .filter() below for a GET /api/products?q=
   call once the catalog is served from a database.
   ===================================================================== */
function openSearch(){
  state.searchOpen = true;
  document.getElementById('search-overlay').classList.add('show');
  document.getElementById('search-panel').classList.add('open');
  setTimeout(()=>document.getElementById('search-input').focus(), 50);
}
function closeSearch(){
  state.searchOpen = false;
  const overlay = document.getElementById('search-overlay');
  const panel = document.getElementById('search-panel');
  if(overlay) overlay.classList.remove('show');
  if(panel) panel.classList.remove('open');
}
function searchResults(){
  const q = state.searchQuery.trim().toLowerCase();
  if(!q) return [];
  return products.filter(p => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
}
function onSearchInput(val){
  state.searchQuery = val;
  const results = searchResults();
  const countEl = document.getElementById('search-count');
  countEl.textContent = val.trim() ? `${results.length} result${results.length===1?'':'s'} for "${val}"` : 'Start typing to search products';
  if(val.trim() && state.view!=='shop'){
    location.hash = '#/shop';
  } else if(val.trim()){
    render();
    // re-focus + restore drawer state after re-render wipes the panel's DOM node classes
    document.getElementById('search-overlay').classList.add('show');
    document.getElementById('search-panel').classList.add('open');
    const input = document.getElementById('search-input');
    input.value = val;
    input.focus();
    input.setSelectionRange(val.length, val.length);
  }
}

  window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');

function whatsappCart(){
  if(cartCount()===0){ toast('Your cart is empty', 'err'); return; }
  let lines = [`Hi ${CONFIG.businessName}${CONFIG.businessNameAccent}! I'd like to order:`, ''];
  for(const id in state.cart){
    const p = products.find(p=>p.id==id);
    lines.push(`• ${p.name} x${state.cart[id]} — ${money(p.price*state.cart[id])}`);
  }
  lines.push('', `Total: ${money(cartTotal())}`);
  window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
}
function whatsappOrder(order){
  let lines = [`Hi ${CONFIG.businessName}${CONFIG.businessNameAccent}! I just placed order ${order.ref}:`, ''];
  order.items.forEach(it => lines.push(`• ${it.name} x${it.qty} — ${money(it.price*it.qty)}`));
  lines.push('', `Total: ${money(order.total)}`, `Delivery: ${order.fulfillment==='pickup' ? 'Pickup' : order.state}`, `Payment: ${order.paymentLabel}`);
  window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
}

/* =====================================================================
   Checkout — collects everything a real payment/fulfillment backend will
   need. "Place order" currently just creates a local order record (see
   submitOrder) and offers to hand it off via WhatsApp. Card payment is
   visibly disabled until Paystack/Flutterwave is wired up.
   TODO(backend): POST the order object to /api/orders, and replace the
   disabled card option with a real Paystack/Flutterwave checkout call.
   ===================================================================== */
function buildDefaultCheckoutForm(){
  const saved = getSavedAccountProfile();
  return {
    name: saved ? (saved.name || '') : '',
    phone: saved ? (saved.phone || '') : '',
    email: saved ? (saved.email || '') : '',
    address: saved ? (saved.address || '') : '',
    state: (saved && saved.state) ? saved.state : CONFIG.deliveryAreas[0].state,
    fulfillment: 'delivery',
    payment: 'transfer',
    notes: ''
  };
}
let checkoutForm = buildDefaultCheckoutForm();

function ccField(key, val){ checkoutForm[key] = val; }
function ccSetFulfillment(val){ checkoutForm.fulfillment = val; render(); }
function ccSetPayment(val){ checkoutForm.payment = val; render(); }

function deliveryFeeFor(stateName){
  const area = CONFIG.deliveryAreas.find(a=>a.state===stateName);
  return area ? area.fee : CONFIG.deliveryAreas[CONFIG.deliveryAreas.length-1].fee;
}

function validateCheckout(){
  const errs = {};
  if(!checkoutForm.name.trim()) errs.name = 'Enter your full name';
  if(!/^[0-9+ ]{7,15}$/.test(checkoutForm.phone.trim())) errs.phone = 'Enter a valid phone number';
  if(checkoutForm.fulfillment==='delivery' && !checkoutForm.address.trim()) errs.address = 'Enter a delivery address';
  return errs;
}

function placeOrder(){
  const errs = validateCheckout();
  state.checkoutErrors = errs;
  if(Object.keys(errs).length){ render(); toast('Please fix the highlighted fields', 'err'); return; }

  const items = Object.keys(state.cart).map(id=>{
    const p = products.find(p=>p.id==id);
    return { id:p.id, name:p.name, price:p.price, qty:state.cart[id] };
  });
  const fee = checkoutForm.fulfillment==='delivery' ? deliveryFeeFor(checkoutForm.state) : 0;
  const paymentLabels = { transfer:'Bank transfer', delivery:'Pay on delivery', card:'Card (Paystack)' };
  const order = {
    ref: 'MB-' + Date.now().toString().slice(-6),
    items,
    subtotal: cartTotal(),
    deliveryFee: fee,
    total: cartTotal() + fee,
    customer: { name:checkoutForm.name, phone:checkoutForm.phone, email:checkoutForm.email },
    fulfillment: checkoutForm.fulfillment,
    address: checkoutForm.address,
    state: checkoutForm.state,
    payment: checkoutForm.payment,
    paymentLabel: paymentLabels[checkoutForm.payment],
    placedAt: new Date().toISOString()
  };

  // TODO(backend): await fetch('/api/orders', {method:'POST', body: JSON.stringify(order)}) then use the server-issued ref/id instead.
  submitOrder(order);
}

function submitOrder(order){
  state.orders.unshift(order);
  saveSharedOrders();
  state.lastOrder = order;
  state.cart = {};
  saveSharedCart();
  checkoutForm = buildDefaultCheckoutForm();
  syncBadges();
  location.hash = '#/order-confirm';
}

/* =====================================================================
   Admin — lets a non-technical business owner see/try the management
   experience today, entirely in-memory. Nothing here persists past a
   refresh yet.
   TODO(backend): wire adminSaveProduct/adminDeleteProduct to real
   POST/PUT/DELETE /api/products endpoints, gate /#/admin behind real
   authentication, and load state.orders from GET /api/orders.
   ===================================================================== */
function adminOpenAdd(){ state.adminModal = {mode:'add', product:{name:'',price:0,oldPrice:null,stock:0,tag:'',icon:'bottle',desc:''}}; render(); }
function adminOpenEdit(id){ state.adminModal = {mode:'edit', product:{...products.find(p=>p.id===id)}}; render(); }
function adminCloseModal(){ state.adminModal = null; render(); }
function adminFieldChange(key, val){ state.adminModal.product[key] = val; }
function adminSaveProduct(){
  const p = state.adminModal.product;
  if(!p.name || !p.name.trim()){ toast('Product name is required', 'err'); return; }
  if(state.adminModal.mode==='add'){
    const nextId = Math.max(0, ...products.map(x=>x.id)) + 1;
    products.push({ ...p, id:nextId, price:Number(p.price)||0, stock:Number(p.stock)||0, oldPrice:p.oldPrice?Number(p.oldPrice):null });
    toast('Product added', 'ok');
  } else {
    const idx = products.findIndex(x=>x.id===p.id);
    products[idx] = { ...products[idx], ...p, price:Number(p.price)||0, stock:Number(p.stock)||0, oldPrice:p.oldPrice?Number(p.oldPrice):null };
    toast('Product updated', 'ok');
  }
  state.adminModal = null;
  render();
}
function adminDeleteProduct(id){
  if(!confirm('Remove this product from the storefront?')) return;
  const idx = products.findIndex(p=>p.id===id);
  if(idx>-1) products.splice(idx,1);
  toast('Product removed', 'ok');
  render();
}

  toast('Store settings updated', 'ok');
  render();
}

const VIEW_RENDERERS = {
  home: renderHome,
  shop: renderShop,
  product: renderProduct,
  checkout: renderCheckout,
  'order-confirm': renderOrderConfirm,
  account: renderAccount,
  admin: renderAdmin,
  about: renderAbout,
  contact: renderContact,
  delivery: renderDelivery,
  privacy: renderPrivacy,
  terms: renderTerms,
  returns: renderReturns
};

function render(){
  const app = document.getElementById('app');
  const renderer = VIEW_RENDERERS[state.view] || renderHome;
  app.innerHTML = renderer();

  document.getElementById('nav-home').classList.toggle('active', state.view==='home');
  document.getElementById('nav-shop').classList.toggle('active', state.view==='shop' || state.view==='product');
  document.getElementById('nav-account').classList.toggle('active', state.view==='account');
  ['navlink-home','navlink-shop','navlink-about','navlink-contact'].forEach(id=>{
    document.getElementById(id).classList.remove('active');
  });
  const activeLink = {home:'navlink-home', shop:'navlink-shop', product:'navlink-shop', about:'navlink-about', contact:'navlink-contact'}[state.view];
  if(activeLink) document.getElementById(activeLink).classList.add('active');
  syncMobileMenuActiveLink();

  syncBadges();
}

applyConfig();
route();
